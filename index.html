<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Parsed Markdown</title>
        <style>
            body {
                font-family:
                    -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                    Helvetica, Arial, sans-serif;
                line-height: 1.6;
                max-width: 800px;
                margin: 40px auto;
                padding: 0 20px;
                color: #333;
            }
            code {
                background-color: #f4f4f4;
                padding: 2px 6px;
                border-radius: 4px;
                font-family: monospace;
            }
            pre {
                background-color: #f4f4f4;
                padding: 16px;
                border-radius: 6px;
                overflow-x: auto;
            }
            pre code {
                padding: 0;
                background: none;
            }
            blockquote {
                border-left: 4px solid #ddd;
                margin: 0;
                padding-left: 16px;
                color: #666;
            }
            img {
                max-width: 100%;
                height: auto;
            }
        </style>
    </head>
    <body>
        <h1>Another attempt</h1>
        <p>--- this is a more precse attempt, let see what it prints.</p>
        <p>Testing <a href="https://www.example.com">rust</a></p>
        <p>
            <strong><em>Hello, world</em></strong>
        </p>
    </body>
</html>
